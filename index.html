<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Openings Live</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6fb;
        --card: #ffffff;
        --text: #1b1f2a;
        --muted: #5f6b85;
        --accent: #3558d6;
        --accent-soft: #eef2ff;
        --border: #e3e8f4;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      * { box-sizing: border-box; }
      body { font-family: "Inter", "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--text); }
      .page { max-width: 960px; margin: 0 auto; padding: 32px 24px 56px; }
      header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
      h1 { margin: 0; font-size: 2rem; }
      .meta { color: var(--muted); margin: 0; }
      .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 20px 0; }
      .controls input { flex: 1 1 280px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-size: 1rem; }
      .stats { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .badge { background: var(--accent-soft); color: var(--accent); padding: 6px 10px; border-radius: 999px; font-size: 0.9rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
      .opening { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
      .opening h2 { margin: 0 0 8px 0; font-size: 1.05rem; }
      .count { color: var(--muted); font-weight: normal; }
      ul { margin: 0; padding-left: 18px; }
      li { margin-bottom: 8px; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .channel { color: var(--muted); font-size: 0.9rem; }
      .muted { color: var(--muted); }
      .error { background: #fff2f2; border: 1px solid #f2c0c0; padding: 12px; border-radius: 10px; color: #a00; }
      .loading { color: var(--muted); font-style: italic; }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Chess Openings Live</h1>
        <p class="meta">Live Lichess TV games grouped by opening. Refreshes every 30 seconds.</p>
      </header>
      <div class="controls">
        <input id="filter" type="text" placeholder="Filter openings or players" />
        <div class="stats">
          <span id="summary" class="badge"></span>
          <span id="status" class="muted"></span>
        </div>
      </div>
      <div id="openings" class="grid"><p class="loading">Loading live games…</p></div>
    </div>
    <script>
      const LICHESS_TV_URL = 'https://lichess.org/api/tv/channels';
      const LICHESS_GAME_URL = 'https://lichess.org/game/export/';

      const state = { openings: [], filter: '' };
      const openingsEl = document.getElementById('openings');
      const statusEl = document.getElementById('status');
      const summaryEl = document.getElementById('summary');
      const filterEl = document.getElementById('filter');

      function render() {
        const needle = state.filter.trim().toLowerCase();
        const filtered = state.openings.filter(opening => {
          if (!needle) return true;
          if (opening.opening.toLowerCase().includes(needle)) return true;
          return opening.games.some(game => game.players.toLowerCase().includes(needle));
        });

        if (!filtered.length) {
          openingsEl.innerHTML = '<p class="muted">No live games found.</p>';
        } else {
          openingsEl.innerHTML = filtered.map(opening => {
            const gamesHtml = opening.games.map(game => (
              `<li><a href="${game.url}" target="_blank" rel="noopener noreferrer">${game.players}</a> <span class="channel">[${game.channel}]</span></li>`
            )).join('');
            return `
              <section class="opening">
                <h2>${opening.opening} <span class="count">(${opening.count})</span></h2>
                <ul>${gamesHtml}</ul>
              </section>
            `;
          }).join('');
        }
        const totalGames = filtered.reduce((sum, o) => sum + o.count, 0);
        summaryEl.textContent = `${filtered.length} openings · ${totalGames} games`;
      }

      function buildOpeningsPayload(games) {
        const grouped = {};
        for (const game of games) {
          const key = game.eco ? `${game.eco} ${game.opening_name}` : game.opening_name;
          if (!grouped[key]) grouped[key] = [];
          grouped[key].push(game);
        }
        return Object.entries(grouped)
          .sort((a, b) => {
            const aUnknown = a[0].toLowerCase().startsWith('unknown');
            const bUnknown = b[0].toLowerCase().startsWith('unknown');
            if (aUnknown !== bUnknown) return aUnknown ? 1 : -1;
            if (b[1].length !== a[1].length) return b[1].length - a[1].length;
            return a[0].toLowerCase().localeCompare(b[0].toLowerCase());
          })
          .map(([opening, openingGames]) => ({
            opening,
            count: openingGames.length,
            games: openingGames.map(g => ({
              url: `https://lichess.org/${g.game_id}`,
              players: `${g.white} vs ${g.black}`,
              channel: g.channel,
            })),
          }));
      }

      async function fetchGame(gameId, channelName) {
        const url = `${LICHESS_GAME_URL}${gameId}?moves=false&opening=true&clocks=false&evals=false`;
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) return null;
        const data = await res.json();
        const opening = data.opening || {};
        const players = data.players || {};
        return {
          game_id: data.id || gameId,
          channel: channelName,
          opening_name: opening.name || 'Unknown',
          eco: opening.eco || '',
          white: (players.white && players.white.user && players.white.user.name) || 'Unknown',
          black: (players.black && players.black.user && players.black.user.name) || 'Unknown',
        };
      }

      async function refresh() {
        statusEl.textContent = 'Refreshing…';
        statusEl.className = 'muted';
        try {
          const tvRes = await fetch(LICHESS_TV_URL, { headers: { 'Accept': 'application/json' } });
          if (!tvRes.ok) throw new Error(`Lichess TV API error (${tvRes.status})`);
          const tvData = await tvRes.json();

          const channels = [];
          for (const [name, payload] of Object.entries(tvData)) {
            if (typeof payload !== 'object' || !payload) continue;
            const gameId = payload.gameId || (payload.game && payload.game.id);
            if (gameId) channels.push({ name, gameId });
          }

          const gameResults = await Promise.all(
            channels.map(ch => fetchGame(ch.gameId, ch.name).catch(() => null))
          );
          const games = gameResults.filter(Boolean);
          state.openings = buildOpeningsPayload(games);
          statusEl.textContent = `Last updated ${new Date().toLocaleTimeString()}`;
          render();
        } catch (error) {
          statusEl.className = 'error';
          statusEl.textContent = `Error: ${error.message}`;
          openingsEl.innerHTML = `<p class="error">Could not load live games. Check your connection or try again shortly.</p>`;
          summaryEl.textContent = '';
        }
      }

      filterEl.addEventListener('input', event => {
        state.filter = event.target.value;
        render();
      });

      refresh();
      setInterval(refresh, 30000);
    </script>
  </body>
</html>
